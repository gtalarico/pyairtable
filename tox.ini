[tox]
# tox-gh-actions is listed so it survives plugin provisioning in CI
requires =
    tox-gh-actions
    tox-min-req
envlist =
    pre-commit
    mypy-py3{11,12,13,14,15}
    py3{11,12,13,14,15}{,-mindeps}
    integration
    coverage

[gh-actions]
python =
    3.11: py311, mypy-py311
    3.12: coverage, mypy-py312
    3.13: py313, mypy-py313
    3.14: py314, mypy-py314
    3.15: py315, mypy-py315

[testenv]
addopts = -v
testpaths = tests
# tox-min-req constrains install_requires to its declared floors during env
# creation; enable it only for -mindeps envs (others fall back to False).
min_req =
    mindeps: True
commands = python -m pytest {posargs:-m 'not integration'}
extras = cli
deps =
    -r requirements-test.txt

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files

[testenv:mypy,mypy-py3{11,12,13,14,15}]
basepython =
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
    py315: python3.15
deps = -r requirements-dev.txt
commands = mypy --cache-dir="{envdir}/mypy_cache" --strict pyairtable scripts tests/test_typing.py

[testenv:integration]
passenv =
    AIRTABLE_API_KEY
    AIRTABLE_ENTERPRISE_ID
commands =
    python -m pytest {posargs:-m integration}
    python scripts/find_model_changes.py

[testenv:coverage]
passenv = COVERAGE_FORMAT
commands =
    python -m pytest -m 'not integration' \
        --cov=pyairtable \
        --cov-report={env:COVERAGE_FORMAT:html} \
        --cov-report=term-missing \
        --cov-fail-under=100

[testenv:docs]
# Sphinx 4.x imports the imghdr module, which was removed in Python 3.13.
basepython = python3.12
deps =
    -r requirements-dev.txt
commands =
    python -m cogapp -cr --verbosity=1 {toxinidir}/docs/source/*.rst
    python -m sphinx -T -E -b html {toxinidir}/docs/source {toxinidir}/docs/build

[pytest]
requests_mock_case_sensitive = true
markers =
    integration: integration tests, hit airtable api

[flake8]
filename = *.py
count = True
# See https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
ignore = E203, E226, E266, E501, E704, W503
select = B,C,E,F,W,T4,B9
max-line-length = 88
max-complexity = 15
exclude =
    .venv
    .eggs
    .tox
    ./docs

[coverage:run]
omit =
    docs/*
    tests/*
    .venv/*
    .tox/*

[coverage:report]
# See https://github.com/nedbat/coveragepy/issues/970
exclude_also =
    @overload
    if (typing\.)?TYPE_CHECKING:
    \)( -> .+)?: \.\.\.$
